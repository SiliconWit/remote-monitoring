<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 430" width="1010" height="430">
<rect width="1010" height="430" fill="white"/>

<text x="252" y="32" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#000" text-anchor="middle" font-weight="bold">(a) Threshold inside the normal band</text>
<text x="758" y="32" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#000" text-anchor="middle" font-weight="bold">(b) Threshold outside it</text>

<!-- (a) scale -->
<line x1="110" y1="80" x2="110" y2="250" stroke="#000" stroke-width="1.6"/>
<text x="100" y="86" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#000" text-anchor="end">90%</text>
<text x="100" y="254" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#000" text-anchor="end">45%</text>

<!-- (a) normal band 51 to 81 -->
<rect x="120" y="114" width="200" height="102" fill="#9aa4ad" stroke="#000" stroke-width="1.4"/>
<text x="220" y="152" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" text-anchor="middle">where the greenhouse</text>
<text x="220" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" text-anchor="middle">lives, every day</text>
<text x="220" y="188" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" text-anchor="middle">51% to 81%</text>

<!-- (a) threshold cutting through it -->
<line x1="120" y1="118" x2="430" y2="118" stroke="#c00000" stroke-width="2.6" stroke-dasharray="9,5"/>
<text x="438" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#c00000" text-anchor="end" font-weight="bold">80%</text>

<text x="70" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#c00000" font-weight="bold">Fires on every ordinary night.</text>
<text x="70" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">24 alerts in a month, 18 of them at 23:00.</text>
<text x="70" y="338" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">The grower stops reading them, and the log</text>
<text x="70" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">stops being usable as evidence.</text>

<!-- (b) scale -->
<line x1="616" y1="80" x2="616" y2="250" stroke="#000" stroke-width="1.6"/>
<text x="606" y="86" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#000" text-anchor="end">90%</text>
<text x="606" y="254" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#000" text-anchor="end">45%</text>

<rect x="626" y="114" width="200" height="102" fill="#9aa4ad" stroke="#000" stroke-width="1.4"/>
<text x="726" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" text-anchor="middle">the same normal band</text>

<!-- (b) threshold above the band -->
<line x1="626" y1="94" x2="936" y2="94" stroke="#c00000" stroke-width="2.6" stroke-dasharray="9,5"/>
<text x="944" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#c00000" text-anchor="end" font-weight="bold">85%</text>

<!-- (b) a genuine excursion -->
<path d="M826,216 L856,120 L886,88 L916,120" fill="none" stroke="#1a4fd6" stroke-width="2.6"/>
<text x="886" y="76" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1a4fd6" text-anchor="middle">vents jammed</text>

<text x="576" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#000" font-weight="bold">Silent all month, then fires once.</text>
<text x="576" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">Better still, alert on duration: above 80% for</text>
<text x="576" y="338" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">more than 8 hours never fires on a night that</text>
<text x="576" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">recovers at dawn, and fires at once on one that does not.</text>

<line x1="512" y1="52" x2="512" y2="370" stroke="#9aa4ad" stroke-width="1.2"/>

<text x="505" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold">An alert should describe a state the equipment does not normally reach. Measure the band first, then set the rule.</text>
</svg>
