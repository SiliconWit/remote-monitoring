<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 430" width="1010" height="430">
<rect width="1010" height="430" fill="white"/>
<text x="252" y="32" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#000" text-anchor="middle" font-weight="bold">(a) Healthy detector, clean air</text>
<text x="758" y="32" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#000" text-anchor="middle" font-weight="bold">(b) Failed element, same output</text>
<rect x="150" y="80" width="200" height="120" rx="6" fill="#eef2f7" stroke="#000" stroke-width="1.6"/>
<circle cx="250" cy="130" r="30" fill="#4FD1C7" stroke="#000" stroke-width="1.6"/>
<text x="250" y="135" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" text-anchor="middle">cell</text>
<text x="250" y="185" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" text-anchor="middle">responds to gas</text>
<text x="252" y="240" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#000" text-anchor="middle" font-weight="bold">0 ppm</text>
<text x="252" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000" text-anchor="middle">because there is nothing to report</text>
<text x="252" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000" text-anchor="middle" font-weight="bold">health 97-100%</text>
<text x="252" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000" text-anchor="middle">the zero is evidence</text>
<rect x="656" y="80" width="200" height="120" rx="6" fill="#eef2f7" stroke="#000" stroke-width="1.6"/>
<circle cx="756" cy="130" r="30" fill="#cbd5e1" stroke="#000" stroke-width="1.6"/>
<line x1="736" y1="110" x2="776" y2="150" stroke="#B45309" stroke-width="2.6"/>
<line x1="776" y1="110" x2="736" y2="150" stroke="#B45309" stroke-width="2.6"/>
<text x="756" y="185" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" text-anchor="middle">poisoned or expired</text>
<text x="758" y="240" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#000" text-anchor="middle" font-weight="bold">0 ppm</text>
<text x="758" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000" text-anchor="middle">because nothing can be reported</text>
<text x="758" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000" text-anchor="middle" font-weight="bold">health falling, or absent</text>
<text x="758" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000" text-anchor="middle">the zero is meaningless</text>
<text x="505" y="395" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle">identical on the gas channel</text>
<line x1="505" y1="60" x2="505" y2="370" stroke="#D1D5DB" stroke-width="1.2"/>
</svg>
