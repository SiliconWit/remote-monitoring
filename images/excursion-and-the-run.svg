<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 430" width="1010" height="430">
<rect width="1010" height="430" fill="white"/>

<text x="252" y="32" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#000" text-anchor="middle" font-weight="bold">(a) Without a record</text>
<text x="758" y="32" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#000" text-anchor="middle" font-weight="bold">(b) With a record</text>

<!-- (a) five runs, all suspect -->
<text x="70" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000">a week of runs</text>
<rect x="70" y="86" width="380" height="26" fill="#c00000" stroke="#000" stroke-width="1.4"/>
<rect x="70" y="120" width="380" height="26" fill="#c00000" stroke="#000" stroke-width="1.4"/>
<rect x="70" y="154" width="380" height="26" fill="#c00000" stroke="#000" stroke-width="1.4"/>
<rect x="70" y="188" width="380" height="26" fill="#c00000" stroke="#000" stroke-width="1.4"/>
<rect x="70" y="222" width="380" height="26" fill="#c00000" stroke="#000" stroke-width="1.4"/>
<text x="260" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#c00000" text-anchor="middle" font-weight="bold">all of it in doubt</text>

<text x="70" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">A result comes out odd. Something may have</text>
<text x="70" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">happened in the incubator, but there is no way</text>
<text x="70" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">to say when, so every run of the week is suspect.</text>

<!-- (b) same runs, one overlapping the excursion -->
<text x="576" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000">the same week</text>
<rect x="576" y="86" width="380" height="26" fill="#9aa4ad" stroke="#000" stroke-width="1.4"/>
<rect x="576" y="120" width="380" height="26" fill="#9aa4ad" stroke="#000" stroke-width="1.4"/>
<rect x="576" y="154" width="380" height="26" fill="#c00000" stroke="#000" stroke-width="1.4"/>
<rect x="576" y="188" width="380" height="26" fill="#9aa4ad" stroke="#000" stroke-width="1.4"/>
<rect x="576" y="222" width="380" height="26" fill="#9aa4ad" stroke="#000" stroke-width="1.4"/>

<!-- (b) the excursion, timestamped -->
<line x1="742" y1="76" x2="742" y2="258" stroke="#c00000" stroke-width="2.2" stroke-dasharray="7,4"/>
<text x="742" y="70" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#c00000" text-anchor="middle" font-weight="bold">Thu 16 July, 00:40 and 10:40</text>
<text x="758" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000" text-anchor="middle">35.7 °C against a 37 °C setpoint</text>

<text x="576" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">One run overlapped it. That run is discarded.</text>
<text x="576" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">The other four are defensible, and you can say</text>
<text x="576" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333">exactly why to a reviewer or an auditor.</text>

<line x1="512" y1="52" x2="512" y2="370" stroke="#9aa4ad" stroke-width="1.2"/>

<text x="505" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold">The record does not prevent the excursion. It tells you which work to throw away, instead of all of it.</text>
</svg>
