<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 430" width="1010" height="430">
<rect width="1010" height="430" fill="white"/>

<text x="252" y="32" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#000" text-anchor="middle" font-weight="bold">(a) As a percentage: looks like a rounding error</text>
<text x="758" y="32" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#000" text-anchor="middle" font-weight="bold">(b) As events: what the equipment actually sees</text>

<!-- (a) the month as a bar -->
<rect x="70" y="70" width="380" height="46" fill="#9aa4ad" stroke="#000" stroke-width="1.6"/>
<rect x="440" y="70" width="10" height="46" fill="#c00000" stroke="#000" stroke-width="1.6"/>
<text x="255" y="99" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000" text-anchor="middle">mains present</text>
<line x1="445" y1="128" x2="445" y2="152" stroke="#c00000" stroke-width="1.4"/>
<text x="445" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c00000" text-anchor="middle">2.5%</text>

<text x="70" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#000" text-anchor="start">30 days  =  43,200 minutes</text>
<text x="70" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#000" text-anchor="start">without mains  =  1,082 minutes</text>
<line x1="70" y1="248" x2="430" y2="248" stroke="#000" stroke-width="1.2"/>
<text x="70" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#000" text-anchor="start" font-weight="bold">availability  =  1 &#8722; 1,082/43,200  =  97.5%</text>

<text x="70" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333" text-anchor="start">Reported as a percentage this passes without comment.</text>
<text x="70" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333" text-anchor="start">The same figure in hours is 18 hours of darkness a month.</text>

<!-- (b) the same month as separate interruptions -->
<line x1="596" y1="70" x2="596" y2="196" stroke="#000" stroke-width="1.6"/>
<line x1="596" y1="196" x2="946" y2="196" stroke="#000" stroke-width="1.6"/>
<text x="771" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" text-anchor="middle">one month</text>

<g stroke="#c00000" stroke-width="3">
  <line x1="612" y1="196" x2="612" y2="120"/>
  <line x1="632" y1="196" x2="632" y2="146"/>
  <line x1="655" y1="196" x2="655" y2="104"/>
  <line x1="676" y1="196" x2="676" y2="150"/>
  <line x1="695" y1="196" x2="695" y2="130"/>
  <line x1="717" y1="196" x2="717" y2="160"/>
  <line x1="736" y1="196" x2="736" y2="112"/>
  <line x1="757" y1="196" x2="757" y2="142"/>
  <line x1="776" y1="196" x2="776" y2="126"/>
  <line x1="798" y1="196" x2="798" y2="154"/>
  <line x1="817" y1="196" x2="817" y2="108"/>
  <line x1="838" y1="196" x2="838" y2="138"/>
  <line x1="857" y1="196" x2="857" y2="164"/>
  <line x1="879" y1="196" x2="879" y2="122"/>
  <line x1="898" y1="196" x2="898" y2="150"/>
  <line x1="920" y1="196" x2="920" y2="132"/>
</g>
<text x="578" y="76" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" text-anchor="end">length</text>

<text x="596" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#000" text-anchor="start">Every interruption restarts everything.</text>
<text x="596" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#000" text-anchor="start" font-weight="bold">damage follows the count, not the total</text>

<text x="596" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333" text-anchor="start">One 18 hour outage wants a generator.</text>
<text x="596" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333" text-anchor="start">Many short ones want ride-through, which is a</text>
<text x="596" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333" text-anchor="start">different purchase. The percentage cannot tell them apart.</text>

<line x1="508" y1="60" x2="508" y2="370" stroke="#9aa4ad" stroke-width="1.2"/>

<text x="505" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333" text-anchor="middle">The alert log recorded 30 outages totalling 204 minutes. The readings recorded 1,082. A log is what crossed a rule, not what happened.</text>
</svg>
